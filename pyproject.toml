[project]
name = "foundry-agent-cicd"
version = "1.0.0"
description = "CI/CD reference implementation for AI agents on Microsoft Foundry"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607"]
"scripts/**" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["foundry_common", "deploy_agent", "promote_agent", "eval_metrics", "run_evaluations", "check_eval_gates", "validate_agent_config"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
